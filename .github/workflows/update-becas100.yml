name: Actualizar Becas100
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Revisar fuentes y estados
        run: python becas100/scripts/update_scholarships.py
      - name: Guardar cambios
        run: |
          git config user.name "becas100-bot"
          git config user.email "actions@users.noreply.github.com"
          git add becas100/data/scholarships.json becas100/data/candidates.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore(becas100): actualización diaria"
            git push
          fi
