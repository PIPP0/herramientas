name: Fix Korea destination image
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-korea-image.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken Korea image and add fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('becas100/stable/index.html')
          s=p.read_text()
          old="'Corea del Sur':{flag:'🇰🇷',x:77,y:32,c:'#8460ff',img:'https://images.unsplash.com/photo-1538485399081-7c8971d6dcaf?auto=format&fit=crop&w=900&q=82'}"
          new="'Corea del Sur':{flag:'🇰🇷',x:77,y:32,c:'#8460ff',img:'https://images.unsplash.com/photo-1780742349905-9da868077544?auto=format&fit=crop&w=900&q=82',fallback:'https://images.unsplash.com/photo-1777550873294-6a4db5d57a00?auto=format&fit=crop&w=900&q=82'}"
          if old not in s:
              raise SystemExit('Korea META source not found')
          s=s.replace(old,new)
          old_dest='<img src="${m.img}" alt="${esc(c)}" onerror="this.style.display=\'none\'">'
          new_dest='<img src="${m.img}" alt="${esc(c)}" onerror="if(this.dataset.fallback){this.style.display=\'none\';return}this.dataset.fallback=\'1\';if(m.fallback){this.src=m.fallback}else{this.style.display=\'none\'}">'
          s=s.replace(old_dest,new_dest)
          old_side='<img src="${m.img}" alt="${esc(selected)}" onerror="this.style.display=\'none\'">'
          new_side='<img src="${m.img}" alt="${esc(selected)}" onerror="if(this.dataset.fallback){this.style.display=\'none\';return}this.dataset.fallback=\'1\';if(m.fallback){this.src=m.fallback}else{this.style.display=\'none\'}">'
          s=s.replace(old_side,new_side)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add becas100/stable/index.html
          git commit -m "Fix South Korea destination image" || exit 0
          git push
