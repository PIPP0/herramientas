name: Patch Becas100 catalog status
on:
  push:
    paths:
      - '.github/workflows/patch-becas100-catalog-status.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject status script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('becas100/stable/index.html')
          s=p.read_text()
          marker='<script src="auth-dashboard.js?v=1"></script>'
          add=marker+'\n<script src="catalog-status.js?v=1"></script>'
          if 'catalog-status.js' not in s:
              s=s.replace(marker,add)
              p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add becas100/stable/index.html
          git diff --cached --quiet || git commit -m "Show scholarship expiry and activation dates"
          git push
