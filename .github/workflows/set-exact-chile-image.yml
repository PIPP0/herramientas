name: Set exact Chile image
on:
  push:
    paths:
      - '.github/workflows/set-exact-chile-image.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write exact Chile image and update page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,re
          b64=''''''
          Path('becas100/stable/assets').mkdir(parents=True,exist_ok=True)
          Path('becas100/stable/assets/chile-selected.jpg').write_bytes(base64.b64decode(b64))
          p=Path('becas100/stable/index.html')
          s=p.read_text()
          s2,n=re.subn(r"('Chile':\{flag:'🇨🇱',x:[^\n]+?img:')[^']+(')",r"\1assets/chile-selected.jpg?v=2\2",s,count=1)
          if n!=1:
              raise SystemExit(f'Chile image replacement count={n}')
          p.write_text(s2)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add becas100/stable/index.html becas100/stable/assets/chile-selected.jpg
          git commit -m "Use exact selected Chile image" || exit 0
          git push