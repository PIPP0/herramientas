name: Becas100 mobile finalize
on:
  push:
    paths:
      - '.github/workflows/becas100-mobile-finalize.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump mobile assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('becas100/stable/index.html')
          s=p.read_text()
          s=s.replace("img:'assets/chile-latest.jpg?v=6'", "img:'assets/chile-fixed.jpg?rev=202609140050'")
          s=s.replace('catalog-status.js?v=6','catalog-status.js?v=9')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add becas100/stable/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Becas100 mobile bundle v9'
          git push