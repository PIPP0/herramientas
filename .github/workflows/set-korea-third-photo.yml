name: Set selected Korea photo
on:
  push:
    paths:
      - '.github/workflows/set-korea-third-photo.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace South Korea destination photo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('becas100/stable/index.html')
          s=p.read_text()
          start=s.index("'Corea del Sur':{")
          end=s.index("\n'Turquía':", start)
          old=s[start:end]
          new="'Corea del Sur':{flag:'🇰🇷',x:77,y:32,c:'#8460ff',img:'https://images.unsplash.com/photo-1743906487913-1919e4c71537?auto=format&fit=crop&w=1200&q=86',fallback:'https://images.unsplash.com/photo-1780742349905-9da868077544?auto=format&fit=crop&w=900&q=82'},"
          if old == new:
              raise SystemExit('Already updated')
          p.write_text(s[:start]+new+s[end:])
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add becas100/stable/index.html
          git commit -m 'Use selected Seoul photo for South Korea destination'
          git push
