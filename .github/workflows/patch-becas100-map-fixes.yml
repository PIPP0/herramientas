name: Patch Becas100 map visuals
on:
  push:
    paths:
      - 'becas100/stable/map-fixes.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject map fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('becas100/stable/index.html')
          s=p.read_text()
          tag='<script src="map-fixes.js?v=2"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add becas100/stable/index.html
          git diff --cached --quiet || (git commit -m 'Fix Korea image and map destination alignment' && git push)
